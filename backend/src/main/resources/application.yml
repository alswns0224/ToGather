spring:
  application:
    name: togather
  config:
    # 저장소 루트의 .env를 읽는다 (backend/ 또는 루트에서 실행하는 경우 모두 지원)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        one-indexed-parameters: false

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true
        same-site: lax

togather:
  # 브라우저 기준 앱 주소. OAuth 콜백도 이 주소의 /api/... 로 돌아온다 (개발 중 Vite가 백엔드로 프록시)
  app-url: ${APP_URL:http://localhost:5173}
  token-key: ${TOGATHER_TOKEN_KEY:}
  auth:
    # true면 Google 로그인 없이 이메일만으로 로그인하는 개발용 API(/api/auth/dev-login)를 연다. 운영에서는 false
    dev-login: ${DEV_LOGIN_ENABLED:false}
  chroma:
    url: ${CHROMA_URL:http://localhost:8000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  slack:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
  notion:
    client-id: ${NOTION_CLIENT_ID:}
    client-secret: ${NOTION_CLIENT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
