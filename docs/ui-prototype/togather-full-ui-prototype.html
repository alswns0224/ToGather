              />

                { id: "notion", label: "Notion 문서" },
                { id: "drive", label: "Google Drive 파일" }

                <button onclick="setSearchProviderFilter('${f.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold ${state.searchProviderFilter === f.id ? 'bg-indigo-600 text-white' : cardCls()}">${f.label}</button>

              <button onclick="resetVectorSearch()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">기본 검색어 복원</button>

            <div class="space-y-4">
              ${filtered.map(r => `
                <div class="rounded-[26px] p-6 ${cardCls()} space-y-3 hover:border-indigo-500/50 transition-all">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      ${badgeHTML(r.provider, "", "sm")}

                    </div>
                    <div class="flex items-center gap-2">
                      <span class="px-3 py-1 rounded-full text-xs font-mono-num font-bold bg-purple-500/15 text-purple-400">✨ 유사도 ${r.similarity}%</span>
                      <a href="${r.deepLink}" target="_blank" rel="noopener" class="px-3 py-1 rounded-xl text-xs font-bold ${subCardCls()}">원본 ↗</a>

                  </div>
                  <p class="text-xs ${mutedText()} leading-relaxed p-3.5 rounded-2xl ${subCardCls()}">${r.preview}</p>
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-mono-num ${mutedText()}">생성: ${r.createdAt}</span>
                    <button onclick="openTaskFromAnywhere(${r.relatedTaskId})" class="font-bold text-indigo-500 hover:underline">🔗 연결된 Task: ${r.relatedTaskTitle} →</button>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function renderAIExtractPage() {
      const pendingList = state.suggestions.filter(s => s.status === "PENDING");
      const scheduleCandidates = pendingList.filter(s => s.type === "SCHEDULE");
      const taskCandidates = pendingList.filter(s => s.type === "TASK");
      const currentItems = state.assistantTab === "SCHEDULE" ? scheduleCandidates : state.assistantTab === "TASK" ? taskCandidates : [];

      return `
        <div class="p-6 lg:p-8 max-w-6xl mx-auto space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="px-3 py-0.5 rounded-full text-[11px] font-bold bg-purple-500/20 text-purple-400">✨ AI TRIAGE INBOX</span>
              <h1 class="font-display text-2xl font-bold mt-1.5">AI 일정 · 할 일 후보 인박스</h1>
              <p class="text-xs ${mutedText()} mt-0.5">Slack과 Gmail 메시지에서 자동 감지된 후보를 수정 후 승인하거나 무시합니다.</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex p-1.5 rounded-2xl ${cardCls()}">
                <button onclick="setAssistantTab('SCHEDULE')" class="px-4 py-2 rounded-xl text-xs font-bold ${state.assistantTab === 'SCHEDULE' ? 'ai-gradient-btn text-white' : mutedText()}">📅 일정 후보 (${scheduleCandidates.length})</button>
                <button onclick="setAssistantTab('TASK')" class="px-4 py-2 rounded-xl text-xs font-bold ${state.assistantTab === 'TASK' ? 'ai-gradient-btn text-white' : mutedText()}">✅ Task 후보 (${taskCandidates.length})</button>
                <button onclick="setAssistantTab('MY_TODO')" class="px-4 py-2 rounded-xl text-xs font-bold ${state.assistantTab === 'MY_TODO' ? 'ai-gradient-btn text-white' : mutedText()}">🗂 내 할 일 (${state.personalTasks.length})</button>
              </div>
              <button onclick="detectNewCandidatesSim()" class="px-4 py-2.5 rounded-2xl text-xs font-bold ${cardCls()}">🔄 후보 재탐지</button>
            </div>
          </div>

          ${state.assistantTab === "MY_TODO" ? `
            <div class="rounded-[28px] p-6 ${cardCls()} space-y-3">
              <h2 class="font-display text-base font-bold">내 개인 할 일 체크리스트 (PersonalTask)</h2>
              ${state.personalTasks.map(pt => `
                <label class="p-4 rounded-2xl ${subCardCls()} flex items-center justify-between gap-3 cursor-pointer">
                  <div class="flex items-center gap-3">
                    <input type="checkbox" ${pt.done ? "checked" : ""} onchange="togglePersonalTask(${pt.id})" class="w-4 h-4 rounded text-indigo-600" />
                    <span class="text-sm font-bold ${pt.done ? 'line-through opacity-50' : ''}">${pt.title}</span>
                  </div>
                  <span class="text-xs font-mono-num ${mutedText()}">${pt.source} · 마감 ${pt.dueDate}</span>
                </label>
              `).join("")}
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${currentItems.map(s => `
                <div class="rounded-[28px] p-6 ${cardCls(s.isTimeUndetermined ? 'ring-2 ring-amber-500/60' : '')} flex flex-col justify-between space-y-4">
                  <div class="space-y-3">
                    <div class="flex items-center justify-between">
                      ${badgeHTML(s.source, s.channel, "sm")}
                      ${s.isTimeUndetermined
                        ? `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500 text-white animate-pulse">⚠️ 시간 미정 (직접 지정)</span>`
                        : `<span class="text-[11px] font-mono-num ${mutedText()}">${s.createdAt}</span>`
                      }
                    </div>

                    <div class="p-3.5 rounded-2xl ${subCardCls()} text-xs italic leading-relaxed">
                      "${s.quote}" — <span class="not-italic font-bold">${s.author}</span>
                    </div>

                    <div>
                      <label class="block text-[10px] font-bold uppercase ${mutedText()} mb-1">승인 전 제목 수정</label>
                      <input value="${s.title}" oninput="updateSuggestionField(${s.id}, 'title', this.value)" class="w-full px-3.5 py-2 rounded-xl ${subCardCls()} text-sm font-bold" />
                    </div>

                    ${s.type === "SCHEDULE" ? `
                      <div class="grid grid-cols-2 gap-2 text-xs">
                        <input type="date" value="${s.date}" onchange="updateSuggestionField(${s.id}, 'date', this.value)" class="px-3 py-2 rounded-xl ${subCardCls()} font-mono-num font-bold" />
                        <input type="text" value="${s.time}" placeholder="시간 입력 (예: 14:00)" oninput="updateSuggestionField(${s.id}, 'time', this.value)" class="px-3 py-2 rounded-xl ${s.isTimeUndetermined ? 'bg-amber-500/15 border border-amber-500 text-amber-500' : subCardCls()} font-mono-num font-bold" />
                      </div>
                    ` : `
                      <div class="grid grid-cols-2 gap-2 text-xs">
                        <select onchange="updateSuggestionField(${s.id}, 'assignee', this.value)" class="px-3 py-2 rounded-xl ${subCardCls()} font-bold">
                          ${["정철준", "백민준", "이찬서", "박도현", "이서연"].map(n => `<option value="${n}" ${s.assignee === n ? 'selected' : ''}>👤 ${n}</option>`).join("")}
                        </select>
                        <input type="date" value="${s.dueDate}" onchange="updateSuggestionField(${s.id}, 'dueDate', this.value)" class="px-3 py-2 rounded-xl ${subCardCls()} font-mono-num font-bold" />
                      </div>
                    `}
                  </div>

                  <div class="pt-3 border-t ${isDark() ? 'border-white/10' : 'border-slate-100'} flex gap-2">
                    <button onclick="approveSuggestion(${s.id})" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-white ai-gradient-btn">
                      ${s.type === 'SCHEDULE' ? '✓ Calendar 등록 승인' : '✓ Task / 할 일 승인'}
                    </button>
                    <button onclick="dismissSuggestion(${s.id})" class="px-4 py-2.5 rounded-xl text-xs font-bold ${subCardCls()}">무시</button>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    /* ─── Command Palette (⌘K) & Modals ─── */
    function renderCommandPalette() {
      if (!state.cmdPaletteOpen) return "";
      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-start justify-center pt-24 p-4" onclick="toggleCmdPalette()">
          <div class="w-full max-w-xl rounded-[28px] p-5 ${cardCls()} shadow-2xl space-y-3" onclick="event.stopPropagation()">
            <form onsubmit="handleGlobalSearchSubmit(event); state.cmdPaletteOpen = false; renderApp()" class="flex items-center gap-3 pb-3 border-b ${isDark() ? 'border-white/10' : 'border-slate-200'}">
              <span class="text-lg">🔍</span>
              <input id="header-search-input" autofocus placeholder="자연어 문맥 검색 또는 이동할 화면 명령 입력..." class="flex-1 bg-transparent text-sm font-bold focus:outline-none" />
              <button type="submit" class="px-3 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold">검색</button>
            </form>
            <div class="grid grid-cols-2 gap-2 text-xs font-bold">
              <button onclick="navigateTo('discussion'); toggleCmdPalette()" class="p-3 rounded-2xl ${subCardCls()} text-left hover:border-indigo-500">✨ AI 논의 정리 스튜디오 열기</button>
              <button onclick="navigateTo('tasks'); setTaskLayoutMode('graph'); toggleCmdPalette()" class="p-3 rounded-2xl ${subCardCls()} text-left hover:border-indigo-500">🕸 Task 맥락 성좌 그래프 보기</button>
              <button onclick="navigateTo('meeting'); toggleCmdPalette()" class="p-3 rounded-2xl ${subCardCls()} text-left hover:border-indigo-500">🗓 스마트 타임 매트릭스 조율</button>
              <button onclick="toggleTheme(); toggleCmdPalette()" class="p-3 rounded-2xl ${subCardCls()} text-left hover:border-indigo-500">🌓 라이트 / 다크 테마 전환</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderModal() {
      if (!state.modal) return "";
      const { type, payload } = state.modal;
      const ws = getActiveWs();
      let content = "";

      if (type === "createWorkspace") {
        content = `
          <h3 class="font-display text-lg font-bold mb-1">새 워크스페이스 생성</h3>
          <form onsubmit="submitCreateWorkspace(event)" class="space-y-3 mt-3 text-xs">
            <input id="modal-ws-name" required placeholder="워크스페이스 이름 *" class="w-full px-4 py-2.5 rounded-2xl ${subCardCls()} font-bold" />
            <textarea id="modal-ws-desc" rows="2" placeholder="프로젝트 설명" class="w-full px-4 py-2.5 rounded-2xl ${subCardCls()}"></textarea>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl font-bold ${subCardCls()}">취소</button>
              <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white ai-gradient-btn">생성하기</button>
            </div>
          </form>
        `;
      } else if (type === "editWorkspace") {
        content = `
          <h3 class="font-display text-lg font-bold mb-2">워크스페이스 정보 수정</h3>
          <form onsubmit="submitEditWorkspace(event)" class="space-y-3 text-xs">
            <input id="modal-edit-ws-name" required value="${ws.name}" class="w-full px-4 py-2.5 rounded-2xl ${subCardCls()} font-bold" />
            <textarea id="modal-edit-ws-desc" rows="2" class="w-full px-4 py-2.5 rounded-2xl ${subCardCls()}">${ws.description}</textarea>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl font-bold ${subCardCls()}">취소</button>
              <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-indigo-600">저장</button>
            </div>
          </form>
        `;
      } else if (type === "deleteWorkspace") {
        content = `
          <h3 class="font-display text-lg font-bold text-rose-500 mb-2">⚠️ 워크스페이스 삭제 확인</h3>
          <p class="text-xs ${mutedText()} leading-relaxed mb-5">정말 <b>"${ws.name}"</b> 공간을 삭제하시겠습니까? OWNER 권한이 확인된 후 삭제됩니다.</p>
          <div class="flex justify-end gap-2 text-xs">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl font-bold ${subCardCls()}">취소</button>
            <button onclick="confirmDeleteWorkspace()" class="px-5 py-2 rounded-xl font-bold bg-rose-600 text-white">삭제 확인</button>
          </div>
        `;
      } else if (type === "joinInvite") {
        content = `
          <h3 class="font-display text-lg font-bold mb-2">🔗 초대 링크로 합류</h3>
          <p class="text-xs ${mutedText()} mb-4">초대 링크 토큰 유효성을 확인하고 MEMBER 역할로 즉시 참여합니다.</p>
          <div class="flex justify-end gap-2 text-xs">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl font-bold ${subCardCls()}">취소</button>
            <button onclick="confirmJoinByInvite()" class="px-5 py-2 rounded-xl font-bold text-white ai-gradient-btn">참여하기</button>
          </div>
        `;
      } else if (type === "removeMember") {
        const mem = ws.members.find(m => m.id === payload);

          <h3 class="font-display text-lg font-bold mb-2">팀원 내보내기 확인</h3>
          <p class="text-xs ${mutedText()} mb-5">정말 <b>${mem ? mem.name : '팀원'}</b> 님을 워크스페이스에서 내보내시겠습니까?</p>
          <div class="flex justify-end gap-2 text-xs">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl font-bold ${subCardCls()}">취소</button>
            <button onclick="confirmRemoveMember(${payload})" class="px-5 py-2 rounded-xl font-bold bg-rose-600 text-white">내보내기</button>
          </div>
        `;

              <label class="flex items-center gap-2.5 p-3 rounded-2xl ${subCardCls()} text-xs font-bold cursor-pointer">
                <input type="checkbox" name="target-chk" value="${t}" ${svc.targets.includes(t) || idx === 0 ? "checked" : ""} class="rounded text-indigo-600" />

            <button onclick="completeReauth('${svc.id}', false)" class="w-full p-4 rounded-2xl text-left bg-indigo-500/15 border border-indigo-500/30 font-bold">
              2. 다른 계정으로 재인증 (연동 대상 재선택)

          </div>

          </div>

        const t = state.tasks.find(x => x.id === payload);

          content = `
            <h3 class="font-display text-lg font-bold text-amber-500 mb-2">⚠️ 회의 안건으로 등록된 Task</h3>
            <p class="text-xs ${mutedText()} leading-relaxed mb-5">진행 중인 회의의 안건으로 등록된 Task는 안건을 먼저 해제한 뒤 삭제할 수 있습니다.</p>

            <div class="flex justify-end gap-2 text-xs">

              <button onclick="confirmDeleteTask(${payload})" class="px-5 py-2 rounded-xl font-bold bg-rose-600 text-white">삭제</button>

            <button onclick="closeModal()" class="px-5 py-2 rounded-xl font-bold bg-indigo-600 text-white">닫기</button>

      if (s.type === "SCHEDULE") {
        state.events.push({ id: "ev-" + Date.now(), title: s.title, date: s.date || "2026-09-22", day: 22, time: s.time || "14:00", isMeeting: false, participants: [state.user.name], desc: "AI 인박스 승인 일정", deepLink: "https://calendar.google.com" });
        showToast(`"${s.title}" 일정이 Calendar에 등록되었습니다.`);
      } else {
        state.personalTasks.unshift({ id: Date.now(), title: s.title, dueDate: s.dueDate || "2026-09-25", done: false, source: s.channel });
        showToast(`"${s.title}" 할 일이 등록되었습니다.`);
      }
    };
    window.dismissSuggestion = function(id) {
      state.suggestions = state.suggestions.filter(x => x.id !== id);
      showToast("후보가 목록에서 제외되었습니다.");
    };
    window.detectNewCandidatesSim = function() {
      state.suggestions.forEach(s => { s.status = "PENDING"; });
      showToast("Slack·Gmail에서 새 후보를 탐지했습니다.");
    };
    window.togglePersonalTask = function(id) {
      const pt = state.personalTasks.find(x => x.id === id);
      if (pt) pt.done = !pt.done;
      renderApp();
    };
    window.confirmGenericModal = function() {
      state.modal = null;
      showToast("완료되었습니다.");
    };

    // Keyboard shortcut for Command Palette (Cmd+K / Ctrl+K)
    window.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        window.toggleCmdPalette();
      }
    });

    window.addEventListener("DOMContentLoaded", renderApp);
    renderApp();
  </script>
</body>
</html>
