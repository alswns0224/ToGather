# 로컬 개발용 저장소. 이미지 버전은 팀 전체가 이 값을 그대로 사용한다.
# 실행: docker compose up -d   (루트의 .env 값을 읽는다)
services:
  postgres:
    image: postgres:17.6
    container_name: togather-postgres
    environment:
      POSTGRES_DB: togather
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d togather"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.0.20
    container_name: togather-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

volumes:
  postgres-data:
  chroma-data:
